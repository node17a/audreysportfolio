<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --parchment: #FAF7F2;
    --blush: #ECC8C5;
    --sage: #A8BBA8;
    --lavender: #CBBFE0;
    --gold: #E8D4A0;
    --ink: #2A2420;
  }

  body {
    background: var(--parchment);
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    min-height: 100vh;
  }

  /* paper grain overlay */
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.4;
  }

  /* ── NAV ── */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 56px; position: relative; z-index: 10;
  }
  .nav-logo {
    font-size: 13px; font-weight: 400; letter-spacing: 0.05em; color: var(--ink);
  }
  .nav-links {
    display: flex; gap: 28px;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(42,36,32,0.4);
  }
  .nav-links a {
    text-decoration: none; color: inherit;
    transition: color .2s;
    padding-bottom: 2px;
    border-bottom: 1px solid transparent;
  }
  .nav-links a:hover { color: var(--ink); border-bottom-color: var(--blush); }

  /* ── HERO — two column, mirror of XY ── */
  .hero {
    display: flex;
    align-items: center;
    padding: 48px 56px 56px;
    gap: 0;
    min-height: calc(100vh - 64px);
    position: relative; z-index: 1;
  }

  /* LEFT: text block — XY style */
  .hero-left {
    flex: 0 0 380px;
    display: flex; flex-direction: column; gap: 0;
  }

  .hero-name {
    font-size: 52px; font-weight: 300;
    letter-spacing: -0.03em; line-height: 1.0;
    color: var(--ink);
    margin-bottom: 20px;
  }

  .hero-desc {
    font-size: 15px; font-weight: 300;
    line-height: 1.75; color: rgba(42,36,32,0.65);
    max-width: 320px; margin-bottom: 28px;
  }
  .hero-desc strong { font-weight: 500; color: var(--ink); }

  /* badges row — mirrors XY's "Prev. @ SIEMENS & AKOOL" */
  .badges {
    display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap;
    font-size: 11px; color: rgba(42,36,32,0.45);
  }
  .badge-label { font-size: 10px; letter-spacing: 0.04em; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px;
    font-size: 10px; font-weight: 400; letter-spacing: 0.02em;
    border: 1px solid rgba(42,36,32,0.12);
    color: var(--ink); background: rgba(255,255,255,0.6);
    transition: background .2s, border-color .2s;
  }
  .badge:hover { background: var(--blush); border-color: var(--blush); cursor: pointer; }
  .badge-dot {
    width: 6px; height: 6px; border-radius: 50%;
    display: inline-block;
  }

  /* RIGHT: illustration — the tulip garden replacing XY's iMac */
  .hero-right {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    min-height: 480px;
  }

  .tulip-stage { position: relative; width: 100%; height: 480px; }

  /* tulip hover glow */
  .tulip-g { cursor: pointer; }
  .tulip-g .glow { transition: opacity 0.4s ease; opacity: 0; }
  .tulip-g:hover .glow { opacity: 1; }
  .tulip-g { transition: transform 0.45s cubic-bezier(.34,1.56,.64,1); transform-origin: center bottom; }
  .tulip-g:hover { transform: scale(1.07) translateY(-6px); }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }
  @keyframes glow-pulse {
    0%,100% { opacity: 0.5; }
    50%      { opacity: 0.9; }
  }
  .tulip-g:hover .glow { animation: glow-pulse 1.6s ease-in-out infinite; }
</style>
</head>
<body>

<nav>
  <span class="nav-logo">Audrey Leo</span>
  <div class="nav-links">
    <a href="#">Home</a>
    <a href="#">Works</a>
    <a href="#">Playground</a>
    <a href="#">About</a>
  </div>
</nav>

<div class="hero">

  <!-- LEFT: bio block, XY-mirrored -->
  <div class="hero-left">
    <div class="hero-name">Audrey<br>Leo</div>

    <div class="hero-desc">
      a storyteller, a <strong>tulip tender</strong>, a designer.<br>
      transitioning from creative computing &amp; installation into <strong>branding &amp; marketing design.</strong>
    </div>

    <div class="badges">
      <span class="badge-label">Works in</span>
      <span class="badge"><span class="badge-dot" style="background:#ECC8C5"></span>Branding</span>
      <span class="badge"><span class="badge-dot" style="background:#CBBFE0"></span>Creative Computing</span>
      <span class="badge"><span class="badge-dot" style="background:#A8BBA8"></span>Illustration</span>
      <span class="badge"><span class="badge-dot" style="background:#E8D4A0"></span>Installation</span>
    </div>
  </div>

  <!-- RIGHT: gradient tulip garden -->
  <div class="hero-right">
    <svg class="tulip-stage" viewBox="0 0 560 480" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="g1" cx="50%" cy="65%" r="55%">
          <stop offset="0%" stop-color="#FDE8E6"/>
          <stop offset="55%" stop-color="#ECC8C5"/>
          <stop offset="100%" stop-color="#D4A8A4"/>
        </radialGradient>
        <radialGradient id="gl1" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ECC8C5" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#ECC8C5" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="g2" cx="50%" cy="65%" r="55%">
          <stop offset="0%" stop-color="#E8DEFF"/>
          <stop offset="55%" stop-color="#CBBFE0"/>
          <stop offset="100%" stop-color="#B0A0CC"/>
        </radialGradient>
        <radialGradient id="gl2" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#CBBFE0" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#CBBFE0" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="g3" cx="50%" cy="65%" r="55%">
          <stop offset="0%" stop-color="#FFF0C8"/>
          <stop offset="55%" stop-color="#E8D4A0"/>
          <stop offset="100%" stop-color="#C8B070"/>
        </radialGradient>
        <radialGradient id="gl3" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#E8D4A0" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#E8D4A0" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="g4" cx="50%" cy="65%" r="55%">
          <stop offset="0%" stop-color="#D8EAD8"/>
          <stop offset="55%" stop-color="#A8BBA8"/>
          <stop offset="100%" stop-color="#809880"/>
        </radialGradient>
        <radialGradient id="gl4" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#A8BBA8" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#A8BBA8" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="g5" cx="50%" cy="65%" r="55%">
          <stop offset="0%" stop-color="#FFDDE0"/>
          <stop offset="55%" stop-color="#E8B0B8"/>
          <stop offset="100%" stop-color="#C88890"/>
        </radialGradient>
        <radialGradient id="gl5" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#E8B0B8" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#E8B0B8" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- T1 blush, tallest, center -->
      <g class="tulip-g" style="transform-origin:200px 460px">
        <circle class="glow" cx="200" cy="130" r="72" fill="url(#gl1)"/>
        <path d="M200 460 C200 390 198 290 200 190" stroke="#A8BBA8" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M200 340 C186 315 172 296 182 284 C192 272 200 296 200 318" fill="#B8CCB8" opacity="0.55"/>
        <path d="M200 280 C188 264 178 248 178 232 C178 218 188 210 196 218 C198 221 199 226 200 232 C201 226 202 221 204 218 C212 210 222 218 222 232 C222 248 212 264 200 280Z" fill="url(#g1)" stroke="rgba(42,36,32,0.07)" stroke-width="0.8"/>
        <path d="M196 248 C194 238 195 226 196 220" stroke="rgba(42,36,32,0.10)" stroke-width="0.7" fill="none"/>
        <path d="M204 248 C206 238 205 226 204 220" stroke="rgba(42,36,32,0.10)" stroke-width="0.7" fill="none"/>
        <ellipse cx="200" cy="280" rx="4" ry="2.5" fill="#A8BBA8" opacity="0.3"/>
      </g>

      <!-- T2 lavender, left -->
      <g class="tulip-g" style="transform-origin:100px 460px">
        <circle class="glow" cx="100" cy="200" r="60" fill="url(#gl2)"/>
        <path d="M100 460 C100 400 99 320 100 230" stroke="#A8BBA8" stroke-width="2" stroke-linecap="round"/>
        <path d="M100 355 C88 332 76 315 85 305 C94 295 100 316 100 336" fill="#B8CCB8" opacity="0.5"/>
        <path d="M100 230 C90 216 82 202 82 190 C82 178 90 172 97 179 C98.5 181 99 185 100 190 C101 185 101.5 181 103 179 C110 172 118 178 118 190 C118 202 110 216 100 230Z" fill="url(#g2)" stroke="rgba(42,36,32,0.07)" stroke-width="0.7"/>
        <path d="M96 200 C95 191 95.5 183 96 179" stroke="rgba(42,36,32,0.09)" stroke-width="0.6" fill="none"/>
        <path d="M104 200 C105 191 104.5 183 104 179" stroke="rgba(42,36,32,0.09)" stroke-width="0.6" fill="none"/>
      </g>

      <!-- T3 gold, right of center -->
      <g class="tulip-g" style="transform-origin:320px 460px">
        <circle class="glow" cx="320" cy="210" r="56" fill="url(#gl3)"/>
        <path d="M320 460 C320 400 319 330 320 240" stroke="#A8BBA8" stroke-width="2" stroke-linecap="round"/>
        <path d="M320 360 C310 338 300 322 308 313 C316 304 320 323 320 342" fill="#B8CCB8" opacity="0.5"/>
        <path d="M320 240 C311 227 304 214 304 203 C304 192 311 187 317 193 C318.5 195 319 199 320 203 C321 199 321.5 195 323 193 C329 187 336 192 336 203 C336 214 329 227 320 240Z" fill="url(#g3)" stroke="rgba(42,36,32,0.07)" stroke-width="0.7"/>
      </g>

      <!-- T4 sage, far left, bud -->
      <g class="tulip-g" style="transform-origin:36px 460px">
        <circle class="glow" cx="36" cy="260" r="44" fill="url(#gl4)"/>
        <path d="M36 460 C36 408 35 348 36 278" stroke="#A8BBA8" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M36 380 C28 360 20 346 27 338 C34 330 37 348 36 364" fill="#C8D8C8" opacity="0.45"/>
        <path d="M36 278 C30 268 25 258 25 250 C25 242 30 238 34 243 C35 245 35.5 248 36 250 C36.5 248 37 245 38 243 C42 238 47 242 47 250 C47 258 42 268 36 278Z" fill="url(#g4)" stroke="rgba(42,36,32,0.07)" stroke-width="0.6"/>
      </g>

      <!-- T5 deep rose, far right -->
      <g class="tulip-g" style="transform-origin:450px 460px">
        <circle class="glow" cx="450" cy="235" r="52" fill="url(#gl5)"/>
        <path d="M450 460 C450 405 449 342 450 265" stroke="#A8BBA8" stroke-width="2" stroke-linecap="round"/>
        <path d="M450 375 C440 354 430 339 438 330 C446 321 450 340 450 358" fill="#B8CCB8" opacity="0.48"/>
        <path d="M450 265 C441 252 434 239 434 228 C434 217 441 212 447 218 C448.5 220 449 224 450 228 C451 224 451.5 220 453 218 C459 212 466 217 466 228 C466 239 459 252 450 265Z" fill="url(#g5)" stroke="rgba(42,36,32,0.07)" stroke-width="0.7"/>
        <path d="M446 237 C445 228 445.5 220 446 218" stroke="rgba(42,36,32,0.09)" stroke-width="0.6" fill="none"/>
        <path d="M454 237 C455 228 454.5 220 454 218" stroke="rgba(42,36,32,0.09)" stroke-width="0.6" fill="none"/>
      </g>

      <!-- ground -->
      <path d="M0 462 Q280 446 560 462" stroke="#A8BBA8" stroke-width="1.2" opacity="0.2" fill="none"/>
      <!-- tiny fallen petal -->
      <ellipse cx="145" cy="463" rx="6" ry="2.5" fill="#ECC8C5" opacity="0.35" transform="rotate(-12 145 463)"/>
      <ellipse cx="380" cy="464" rx="5" ry="2" fill="#CBBFE0" opacity="0.3" transform="rotate(8 380 464)"/>
    </svg>
  </div>

</div>

</body>
</html>
